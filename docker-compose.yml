services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./backend/models:/app/backend/models
      - ./drift_reports:/app/drift_reports
    environment:
      - LPDG_DATA_DIR=/app/data
      - LPDG_MODELS_DIR=/app/backend/models
      - LPDG_REPORTS_DIR=/app/drift_reports
      - LPDG_PREDICTIONS_PATH=/app/backend/predictions.csv
    command: >
      sh -c "if [ ! -f models/ACTIVE ]; then python -m src.train --data /app/data --promote; fi &&
      python -m src.drift_monitor --data /app/data &&
      python -m src.predict --data /app/data --out /app/backend/predictions.csv &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
