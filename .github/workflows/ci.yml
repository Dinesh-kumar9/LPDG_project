name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check, Security & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio ruff mypy bandit

      - name: Run Ruff (Linter & Format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (Strict Type Checking)
        run: |
          mypy src/ api/ schemas/

      - name: Run Bandit (Security Scan)
        run: |
          bandit -r src/ api/ -x tests/ -ll

      - name: Run Pytest with Coverage Gate
        run: |
          pytest tests/ --cov=src --cov=api --cov-fail-under=75
