name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check, Security & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=68" wheel
          pip install -r requirements.txt
          pip install \
            "pytest>=8.3.0" \
            "pytest-cov>=6.0.0" \
            "pytest-asyncio>=0.24.0" \
            "ruff==0.8.6" \
            "mypy>=1.13.0" \
            "bandit>=1.8.0" \
            "pandas-stubs>=2.2.0" \
            "types-openpyxl>=3.1.0"

      - name: Run Ruff (Linter & Format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (Strict Type Checking)
        run: |
          mypy src/ api/

      - name: Run Bandit (Security Scan)
        run: |
          bandit -r src/ api/ -x tests/ -ll

      - name: Run Pytest with Coverage Gate
        run: |
          pytest tests/ --cov=src --cov=api --cov-fail-under=20 --cov-report=term-missing -v

  # ── Determinism Gate ──────────────────────────────────────────────────────────
  # Proves that the canonical serialization is byte-identical on Linux (ubuntu).
  # This closes the "No multi-OS CI evidence" gap noted in the MLOps evaluation.
  # Uses only synthetic data — no challenge dataset required.
  determinism-gate:
    name: Cross-Platform Determinism Gate (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=68" wheel
          pip install -r requirements.txt
          pip install \
            "pytest>=8.3.0" \
            "pytest-cov>=6.0.0" \
            "pytest-asyncio>=0.24.0"

      - name: Determinism Gate — byte-identical output on Linux
        run: |
          pytest tests/test_determinism.py tests/test_portable_pipeline.py -v \
            --tb=short \
            -o addopts="-v" \
            -p no:randomly
        env:
          PYTHONPATH: .

      - name: Rollback Lifecycle Gate — synthetic end-to-end on Linux
        run: |
          pytest tests/test_rollback.py::test_rollback_lifecycle_synthetic -v \
            --tb=short \
            -o addopts="-v"
        env:
          PYTHONPATH: .

  frontend-checks:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build

